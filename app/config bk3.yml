uptrends:
  std_uptrend:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      key_indicator: stoch_rsi
      key_indicator_index: 2
      key_indicator_type: indicators
      key_signal: slow_k
      key_period_count: 1
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      key_indicator: stoch_rsi
      key_indicator_index: 1
      key_indicator_type: indicators
      key_signal: slow_k
      key_period_count: 1
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      key_indicator: stoch_rsi
      key_indicator_index: 0
      key_indicator_type: indicators
      key_signal: slow_k
      key_period_count: 1


