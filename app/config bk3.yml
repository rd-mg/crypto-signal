indicators:
  rsi: 
    - enabled: false

  macd:
    - enabled: false
  
  sqzmom:
    - enabled: false
      alert_enabled: true
      alert_frequency: always
      candle_period: 4h
      signal:
        - close 

  stoch_rsi:
    - enabled: true
      candle_period: 15m
      alert_enabled: true
      alert_frequency: always
      cold: 95
      hot: 95
      signal:
        - stoch_rsi
        - slow_k
        # - slow_d
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'StochRSI 15m'
      mute_cold: false
    - enabled: true
      candle_period: 1h
      alert_enabled: true
      alert_frequency: always
      cold: 60
      hot: 60
      signal:
        - stoch_rsi
        - slow_k
        # - slow_d
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'StochRSI 1h'
      mute_cold: false
    - enabled: true
      candle_period: 5m
      alert_enabled: true
      alert_frequency: always
      cold: 99
      hot: 99
      signal:
        # - stoch_rsi
        - slow_k
        - slow_d

  stochrsi_cross:
    - enabled: true
      candle_period: 15m
      alert_enabled: true
      alert_frequency: once
      cold: 80
      hot: 80
      signal:
        # - stoch_rsi
        - smooth_k
        - smooth_d
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'StochRSI Cross 15m'
      mute_cold: false
    - enabled: true
      candle_period: 1h
      alert_enabled: true
      alert_frequency: always
      cold: 80
      hot: 80
      signal:
        # - stoch_rsi
        - smooth_k
        - smooth_d
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'StochRSI Cross 1h'
      mute_cold: false


  iiv:
    - enabled: false

  iip:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      signal:
        - iip
      hot: 1.4
      candle_period: 1h
      period_count: 9
      mute_cold: false

  ma_crossover:
    - enabled: true
      alert_enabled: true
      candle_period: 1h
      alert_frequency: always
      signal:
        - fast_values
        - slow_values
      ma_fast: 5
      ma_slow: 7
      exponential: True
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'MA Cross 1h'
      mute_cold: false
    - enabled: true
      alert_enabled: true
      candle_period: 4h
      alert_frequency: always
      signal:
        - fast_values
        - slow_values
      ma_fast: 4
      ma_slow: 6
      exponential: True
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'MA Cross 4h'
      mute_cold: false
    - enabled: true
      alert_enabled: true
      candle_period: 1d
      alert_frequency: always
      signal:
        - fast_values
        - slow_values
      ma_fast: 3
      ma_slow: 5
      exponential: True
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'MA Cross 1d'
      mute_cold: false

  macd_cross:
    - enabled: false
      alert_enabled: true
      candle_period: 15m
      alert_frequency: always
      signal:
        - macd
        - signal
        - macdhist
      hot_label: 'Uptrend is coming'
      cold_label: 'Downtred is coming'
      indicator_label: 'MACD Cross 15m'


  ichimoku:
    - enabled: false
  momentum:
    - enabled: false
  cci:
    - enabled: true
      candle_period: 5m
      alert_enabled: true
      alert_frequency: always
      cold: 200
      hot: -200
      signal:
        - cci
      hot_label: 'Momentum Increasing or OverSold'
      cold_label: 'Momentum Decreasing or OverBought'
      indicator_label: 'CCI 15m'
      mute_cold: false
    - enabled: true
      candle_period: 15m
      alert_enabled: true
      alert_frequency: always
      cold: 200
      hot: -200
      signal:
        - cci
      hot_label: 'Momentum Increasing or OverSold'
      cold_label: 'Momentum Decreasing or OverBought'
      indicator_label: 'CCI 15m'
      mute_cold: false
    - enabled: true
      candle_period: 1h
      alert_enabled: true
      alert_frequency: always
      cold: 200
      hot: -200
      signal:
        - cci
      hot_label: 'Momentum Increasing or OverSold'
      cold_label: 'Momentum Decreasing or OverBought'
      indicator_label: 'CCI 1h'
      mute_cold: false

  mfi:
    - enabled: false
  obv:
    - enabled: false
  bollinger:
    - enabled: false

  bbp:
    - enabled: false
      candle_period: 15m
      alert_enabled: true
      alert_frequency: always
      period_count: 20
      hot: 0.33
      cold: 0.4
      std_dev: 2
      signal:
        - bbp
        # - mfi
      hot_label: 'Lower Band'
      cold_label: 'Upper Band'
      indicator_label: 'Bollinger Crossing 15m'
      mute_cold: false

  natr:
    - enabled: false
      alert_enabled: true
      alert_frequency: always
      signal:
        - natr
      candle_period: 15m
      period_count: 9
      hot_label: 'Hot'
      cold_label: 'Cold'
      indicator_label: 'NATR'
      mute_cold: false
  bollinger_bands:
    - enabled: false
      alert_enabled: true
      alert_frequency: always
      signal:
        # - upperband
        # - middleband
        # - lowerband
        - bbwidth
      candle_period: 15m
      period_count: 20
      hot_label: 'Hot'
      cold_label: 'Cold'
      indicator_label: 'BB'
      mute_cold: false

  ifish_stoch:
    - enabled: false
      alert_enabled: true
      alert_frequency: always
      signal:
        - ifish_stoch
      candle_period: 15m
      period_count: 5
      hot: -0.9
      cold: 0.9
      hot_label: 'Hot'
      cold_label: 'Cold'
      indicator_label: 'Ifish Stoch'
      mute_cold: false

  stoch_hma_avg_rsi:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      signal:
        - stoch_hma_avg_rsi
      hot: 50
      cold: 50
      candle_period: 1h
      period_count: 3
      mute_cold: false

  stoch_hma:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      signal:
        - stoch_hma
      hot: 80
      cold: 80
      candle_period: 1h
      period_count: 9

  roc:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      hot: 1
      cold: -1
      signal:
        - roc
      candle_period: 15m
      period_count: 1
      hot_label: 'Hot'
      cold_label: 'Cold'
      indicator_label: 'ROC'
      mute_cold: false


informants:
  lrsi:
    - enabled: false
      alert_enabled: true
      signal:
        - lrsi
      candle_period: 15m
  hma:
    - enabled: false
      signal:
        - hma
      candle_period: 1h
      period_count: 3
  vwap:
    - enabled: false
  sma:
    - enabled: false
  ema:
    - enabled: false

  ohlcv:
    - enabled: true
      signal:
        # - open
        # - high
        # - low
        - close
        # - volume
      candle_period: 5m


crossovers:
  std_crossover:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      key_indicator: stoch_rsi
      key_indicator_index: 1
      key_indicator_type: indicators
      key_signal: slow_k
      crossed_indicator: stoch_hma_avg_rsi
      crossed_indicator_index: 0
      crossed_indicator_type: indicators
      crossed_signal: stoch_hma_avg_rsi

    # Crossunder #1 4h
